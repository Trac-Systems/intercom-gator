[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
offline = true
# Resolve the Sepolia endpoint only when that script is explicitly invoked.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[invariant]
runs = 128
depth = 64
fail_on_revert = true
