name: Native Windows and Linux

on:
  push:
    branches: ['fix/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Windows needs Node.js 22.17+ (older releases fail key creation); Linux and macOS keep 22.13.
          - { os: windows-latest, node: '22.17.0' }
          - { os: windows-latest, node: '22' }
          - { os: ubuntu-latest, node: '22.13.0' }
          - { os: ubuntu-latest, node: '22' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node bin/gator.js bundle verify
      - name: Start, read the loopback API, and stop
        run: node .github/scripts/daemon-smoke.mjs
