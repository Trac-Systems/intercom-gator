name: Native Windows and Linux

on:
  push:
    branches: ['fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.13.0', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node bin/gator.js bundle verify
      - name: Start, read the loopback API, and stop
        run: node .github/scripts/daemon-smoke.mjs
